[project]
name = "fasthtml-basecoat"
version = "1.1.0"
description = "Basecoat components and bundled assets for FastHTML."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["BASECOAT-LICENSE", "LICENSE"]
authors = [{ name = "SpaceShaman", email = "spaceshaman@tuta.io" }]
keywords = ["basecoat", "components", "fasthtml", "tailwindcss", "web"]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["fasthtml-tailwindcss>=4.3.3.post1", "python-fasthtml>=0.14.14"]

[project.urls]
Documentation = "https://github.com/SpaceShaman/fasthtml-basecoat#readme"
Homepage = "https://github.com/SpaceShaman/fasthtml-basecoat"
Issues = "https://github.com/SpaceShaman/fasthtml-basecoat/issues"
Repository = "https://github.com/SpaceShaman/fasthtml-basecoat"

[dependency-groups]
dev = ["beautifulsoup4>=4.13", "fasthtml-tailwindcss[dev]>=4.3.3.post1,<5", "hatchling>=1.27", "httpx", "pytest>=8", "ruff", "tinycss2>=1.4"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["src/fasthtml_basecoat/assets/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fasthtml_basecoat"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/scripts", "/tests", "/hatch_build.py", "/pyproject.toml", "/README.md", "/LICENSE", "/BASECOAT-LICENSE", "/generation.json"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
