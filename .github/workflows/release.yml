name: Release

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.11'
      - name: Check npm and PyPI
        id: check
        run: uv run --no-project python -m scripts.check_release
      - name: Generate, build and test
        if: steps.check.outputs.release == 'true'
        run: |
          uv run --group dev python -m scripts.generate
          uv run --group dev ruff check src scripts tests hatch_build.py
          uv build --no-sources
          uv pip install --group dev dist/*.whl
          uv run --no-project python -m pytest -q
      - name: Commit tested sources and tag
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml uv.lock src/fasthtml_basecoat generation.json BASECOAT-LICENSE
          if ! git diff --cached --quiet; then git commit -m "Release $VERSION"; fi
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "v$VERSION")" = "$(git rev-parse HEAD)"
          else
            git tag "v$VERSION"
          fi
          git push --atomic origin "HEAD:${{ github.event.repository.default_branch }}" "refs/tags/v$VERSION"
      - name: Publish to PyPI
        if: steps.check.outputs.release == 'true'
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
